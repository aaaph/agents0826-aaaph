# Team-shared Neo4j (vector + graph memory) for Claude Code.
# Deployed on <NEO4J_HOST>. One graph, project-scoped via :Memory.project.
# Password comes from .env (NEO4J_PASSWORD) — never hardcode, never commit.
#
# Apply:  ./deploy.sh
# Manual: docker compose -f docker-compose.neo4j.yml --env-file .env up -d
services:
  neo4j:
    image: neo4j:5-community
    container_name: neo4j-team
    restart: unless-stopped
    ports:
      - "7474:7474"   # HTTP browser UI
      - "7687:7687"   # Bolt (HOOKS_NEO4J_URI=bolt://<NEO4J_HOST>:7687)
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_server_memory_heap_max__size: "2G"
      NEO4J_server_memory_pagecache_size: "1G"
      # Listen on all interfaces so the team (within <CORP_DOMAIN>/VPN) can reach Bolt.
      NEO4J_server_default__listen__address: "0.0.0.0"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

volumes:
  neo4j_data:
  neo4j_logs:
